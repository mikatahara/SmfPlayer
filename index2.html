<!DOCTYPE html>

<head>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/encoding-japanese/2.0.0/encoding.min.js"></script>
</head>

<body>

	<h2>TEST</h2>

	<script>
		const str = "あいうえお<<>>"
		console.log(str);
		console.log(str.length);

		var str2 = [0x3c, 0x83, 0x43, 0x83, 0x93, 0x83, 0x67, 0x83, 0x8d, 0x30, 0x00, 0x00, 0x00, 0x00];
		var ly = convertShiftJISToUTF8(str2);
//		const oneByteChars = extractOneByteChars(utf8str);

		const result = [];

		for (const ch of ly) {
			const code = ch.charCodeAt(0);
			if(code==0){

			} else if (code <= 0x7F) { // ASCII範囲（1バイト）
//				result+="か";
				result.push('か');
			} else {
				result.push(ch);
			}
		}

		console.log(ly);
		console.log(result.join(""));
		console.log(result);

		// 例: Shift-JISのバイナリデータ（Uint8Array）をUTF-8の文字列に変換
		function convertShiftJISToUTF8(sjisArrayBuffer) {
			// ArrayBuffer → Uint8Array に変換
			const sjisBytes = new Uint8Array(sjisArrayBuffer);

			// Shift-JIS → Unicode（内部的にUTF-16）に変換
			const unicodeString = Encoding.convert(sjisBytes, {
				to: 'UNICODE',
				from: 'SJIS',
				type: 'string'
			});

			// これで JavaScript の文字列（UTF-8扱い）として使える
			// console.log(unicodeString);
			console.log(Array.from(unicodeString).length);
			return unicodeString;
		}

	</script>

</body>



</html>
